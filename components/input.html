<!-- ============================================================
     HOTEL LUXURY TV TEMPLATE v2.0.1 - TV INPUTS / HDMI PORTS
     Native Flutter Bridge TvInputManager Hardware Interface
     ============================================================ -->
<div class="w-full max-w-[1560px] rounded-3xl border-2 border-amber-500/60 bg-gradient-to-br from-[#121214]/95 via-[#0d0d0f]/95 to-black/95 p-6 lg:p-7 max-h-[820px] shadow-[0_25px_70px_rgba(0,0,0,0.95),inset_0_0_25px_rgba(179,138,45,0.15)] backdrop-blur-2xl flex flex-col justify-between relative overflow-hidden select-none font-sans">

    <!-- Ambient Golden Glow in background -->
    <div class="absolute -top-32 left-1/3 w-[36rem] h-[36rem] bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- ============================================================
         1. HORIZONTAL TV HEADER BAR (Matches Applications & Screen Cast)
         ============================================================ -->
    <div class="flex items-center justify-between pb-5 border-b border-amber-500/30 flex-shrink-0 relative z-10">
        <div class="flex items-center gap-4">
            <!-- Hardware TV Port Glowing Icon -->
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500/30 to-amber-600/15 border-2 border-amber-500/70 flex items-center justify-center text-3xl text-amber-400 shadow-[0_0_20px_rgba(179,138,45,0.4)] flex-shrink-0">
                <svg class="w-8 h-8 text-amber-400 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 6h16a2 2 0 0 1 2 2v7a1 1 0 0 1-1 1h-2l-2 2H7l-2-2H3a1 1 0 0 1-1-1V8a2 2 0 0 1 2-2zm2 4v4h2v-4H6zm4 0v4h2v-4h-2zm4 0v4h2v-4h-2z" />
                </svg>
            </div>
            <div class="text-left">
                <h1 class="text-3xl font-black uppercase tracking-[0.16em] text-amber-400 drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)] leading-tight">
                    TV INPUTS
                </h1>
                <p class="text-sm font-semibold text-slate-300 tracking-wide mt-0.5">
                    Select a connected hardware port to switch TV display (HDMI, Set-top Box, Console, AV, Tuner)
                </p>
            </div>
        </div>

        <!-- Right Side: Current Active Source & Remote Help Badge -->
        <div class="flex items-center gap-4">
            <!-- Active Display Indicator Pill -->
            <div class="px-4 py-2 rounded-full bg-amber-500/15 border border-amber-500/50 text-amber-300 text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.9)] animate-pulse"></span>
                <span>Active:</span>
                <span class="text-white font-extrabold" x-text="currentActivePortId ? currentActivePortId.replace(/_/g, ' ') : 'HDMI 1'">HDMI 1</span>
            </div>

            <!-- D-Pad TV Remote Guide -->
            <div class="hidden sm:flex items-center gap-2 text-xs text-slate-300 font-bold px-4 py-2 bg-white/5 rounded-xl border border-white/10">
                <span>Use</span>
                <span class="px-2 py-0.5 rounded bg-black/80 border border-white/20 text-white font-mono text-[11px]">◄ ►</span>
                <span>to select &</span>
                <span class="px-2 py-0.5 rounded bg-amber-400 text-black font-black text-[11px] shadow-sm">OK</span>
                <span>to Switch</span>
            </div>
        </div>
    </div>

    <!-- ============================================================
         2. LOADING STATE
         ============================================================ -->
    <template x-if="inputLoading">
        <div class="flex flex-col items-center justify-center py-24 space-y-4 relative z-10">
            <div class="w-14 h-14 border-4 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
            <span class="text-slate-300 font-extrabold text-base tracking-wider uppercase">Querying TV Ports via Flutter...</span>
        </div>
    </template>

    <!-- ============================================================
         3. TV INPUTS DYNAMIC ADAPTIVE HARDWARE PORTS GRID
         Automatically adapts layout for 1, 2, 3, 4, 5, or 6+ ports
         ============================================================ -->
    <template x-if="!inputLoading">
        <div class="w-full relative z-10 my-4">
            <div :class="getGridContainerClass()">

                <template x-for="(port, idx) in inputPorts" :key="port.id || idx">
                    <div :id="`input_port_${idx}`"
                         tabindex="0"
                         @click="selectInputPort(port)"
                         @mouseenter="activeInputFocusIndex = idx; lastInputPortIndex = idx; document.getElementById('tv-header-back-btn')?.blur();"
                         @focus="activeInputFocusIndex = idx; lastInputPortIndex = idx; document.getElementById('tv-header-back-btn')?.blur();"
                         class="group relative flex flex-col items-center justify-between cursor-pointer transition-all duration-300 outline-none select-none text-center"
                         :class="[
                             isCompactLayout() ? 'p-5 rounded-2xl min-h-[270px]' : 'p-7 rounded-3xl min-h-[350px]',
                             activeInputFocusIndex === idx 
                                 ? 'bg-gradient-to-b from-amber-500/25 via-[#1a160e] to-black border-2 border-amber-400 scale-[1.03] shadow-[0_0_40px_rgba(255,215,0,0.7),0_18px_35px_rgba(0,0,0,0.95)] z-20 ring-2 ring-amber-300' 
                                 : (isPortActive(port) 
                                     ? 'bg-amber-500/[0.08] border-2 border-amber-400/50 shadow-[0_0_25px_rgba(255,215,0,0.2)] z-10' 
                                     : 'bg-white/[0.04] border border-white/10 hover:border-amber-500/40 hover:bg-white/[0.08] z-10')
                         ]">

                        <!-- Top Tag Bar -->
                        <div class="w-full flex items-center justify-between gap-2 mb-1.5">
                            <!-- Hardware Spec Tag -->
                            <span class="px-3 py-0.5 rounded-full text-[11px] font-black tracking-wider uppercase truncate"
                                  :class="port.type === 'TUNER' ? 'bg-blue-500/20 text-blue-300 border border-blue-500/40' : (port.type === 'AV' ? 'bg-orange-500/20 text-orange-300 border border-orange-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40')"
                                  x-text="port.badge || port.type || 'HDMI'">
                            </span>

                            <!-- Active / Ready Status Beacon -->
                            <template x-if="isPortActive(port)">
                                <div class="flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-amber-400 text-black text-[10px] font-black tracking-wider shadow-[0_0_15px_rgba(255,215,0,0.7)] flex-shrink-0">
                                    <span class="w-2 h-2 rounded-full bg-black animate-ping"></span>
                                    <span>ACTIVE</span>
                                </div>
                            </template>
                            <template x-if="!isPortActive(port)">
                                <div class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-500/30 text-emerald-400 text-[10px] font-extrabold tracking-wider flex-shrink-0">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400"
                                          :class="activeInputFocusIndex === idx ? 'animate-ping' : ''"></span>
                                    <span>READY</span>
                                </div>
                            </template>
                        </div>

                        <!-- Hardware Vector Icon Container -->
                        <div class="flex items-center justify-center transition-all duration-300 group-hover:scale-105"
                             :class="[
                                 isCompactLayout() ? 'my-2 w-16 h-16 rounded-xl' : 'my-4 w-24 h-24 rounded-2xl',
                                 activeInputFocusIndex === idx 
                                     ? 'bg-gradient-to-br from-amber-400 to-amber-500 text-black shadow-[0_0_30px_rgba(255,215,0,0.9)]' 
                                     : (isPortActive(port) ? 'bg-[#221c10] border-2 border-amber-400/80 text-amber-400' : 'bg-black/60 border border-white/15 text-amber-400')
                             ]">

                            <!-- HDMI Plug Vector -->
                            <template x-if="port.type === 'HDMI'">
                                <svg :class="isCompactLayout() ? 'w-10 h-10' : 'w-14 h-14'" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M4 6h16a2 2 0 0 1 2 2v7a1 1 0 0 1-1 1h-2l-2 2H7l-2-2H3a1 1 0 0 1-1-1V8a2 2 0 0 1 2-2zm2 4v4h2v-4H6zm4 0v4h2v-4h-2zm4 0v4h2v-4h-2z" />
                                </svg>
                            </template>

                            <!-- AV RCA Composite Vector -->
                            <template x-if="port.type === 'AV'">
                                <svg :class="isCompactLayout() ? 'w-10 h-10' : 'w-14 h-14'" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <circle cx="7" cy="12" r="5" stroke-width="2" />
                                    <circle cx="7" cy="12" r="2" fill="currentColor" />
                                    <circle cx="17" cy="12" r="5" stroke-width="2" />
                                    <circle cx="17" cy="12" r="2" fill="currentColor" />
                                </svg>
                            </template>

                            <!-- Tuner / TV Antenna Vector -->
                            <template x-if="port.type === 'TUNER'">
                                <svg :class="isCompactLayout() ? 'w-10 h-10' : 'w-14 h-14'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M7 4l5 4 5-4M4 8h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm8 4v4m-3-2h6" />
                                </svg>
                            </template>
                        </div>

                        <!-- Port Name & Device Type Hint -->
                        <div class="mt-1 w-full px-2 text-center">
                            <h3 class="font-black uppercase tracking-wider transition-colors duration-200"
                                :class="[
                                    isCompactLayout() ? 'text-xl' : 'text-2xl',
                                    activeInputFocusIndex === idx ? 'text-amber-300 drop-shadow-[0_2px_10px_rgba(255,215,0,0.6)]' : 'text-white'
                                ]"
                                x-text="port.label || port.name || port.id">
                            </h3>
                            <p class="text-slate-300 text-xs mt-1 font-semibold truncate"
                               x-text="port.description">
                            </p>
                        </div>

                        <!-- Action Button Pill -->
                        <div class="w-full border-t border-white/10 flex items-center justify-center"
                             :class="isCompactLayout() ? 'mt-3 pt-3' : 'mt-5 pt-4'">
                            <span class="rounded-full font-black uppercase tracking-wider transition-all duration-300"
                                  :class="[
                                      isCompactLayout() ? 'px-4 py-1.5 text-[11px]' : 'px-6 py-2.5 text-xs',
                                      activeInputFocusIndex === idx 
                                          ? 'bg-amber-400 text-black shadow-[0_0_25px_rgba(255,215,0,0.85)] scale-105' 
                                          : (isPortActive(port) ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-white/10 text-slate-300 group-hover:bg-amber-400 group-hover:text-black')
                                  ]">
                                <span x-text="isPortActive(port) ? 'CURRENT SOURCE ✓' : 'SWITCH INPUT ↵'"></span>
                            </span>
                        </div>

                    </div>
                </template>

            </div>
        </div>
    </template>

    <!-- ============================================================
         4. SWITCHING INPUT OVERLAY (Alpine Reactive Modal)
         ============================================================ -->
    <div x-show="isSwitchingInput"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-90"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-90"
         class="absolute inset-0 bg-black/95 backdrop-blur-3xl z-50 flex flex-col items-center justify-center p-8">
        <div class="w-28 h-28 rounded-3xl bg-gradient-to-br from-amber-400 to-amber-500 text-black flex items-center justify-center shadow-[0_0_60px_rgba(255,215,0,0.9)] animate-pulse mb-6">
            <svg class="w-16 h-16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M4 6h16a2 2 0 0 1 2 2v7a1 1 0 0 1-1 1h-2l-2 2H7l-2-2H3a1 1 0 0 1-1-1V8a2 2 0 0 1 2-2zm2 4v4h2v-4H6zm4 0v4h2v-4h-2zm4 0v4h2v-4h-2z" />
            </svg>
        </div>
        <h3 class="text-3xl sm:text-4xl font-black text-amber-400 tracking-wider uppercase mb-2">
            SWITCHING TV DISPLAY...
        </h3>
        <p class="text-slate-200 text-lg font-semibold tracking-wide">
            Connecting hardware signal to <span class="text-white font-black" x-text="switchingPortName"></span>
        </p>
        <div class="w-72 h-2.5 bg-white/20 rounded-full mt-6 overflow-hidden">
            <div class="h-full bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 rounded-full animate-pulse w-full"></div>
        </div>
    </div>

</div>
