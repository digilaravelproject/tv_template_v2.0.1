<!-- ============================================================
     HOTEL LUXURY TV TEMPLATE v2.0.1 — WEATHER DASHBOARD
     Premium Atmospheric Telemetry (Hospitality TV Design System)
     ============================================================ -->
<div class="w-full max-w-[1560px] rounded-3xl border-2 border-amber-500/60 bg-gradient-to-br from-[#121214]/95 via-[#0d0d0f]/95 to-black/95 p-6 shadow-[0_25px_70px_rgba(0,0,0,0.95),inset_0_0_25px_rgba(179,138,45,0.15)] backdrop-blur-2xl flex flex-col justify-between relative overflow-hidden select-none font-sans">

    <!-- Ambient Golden Glow in background -->
    <div class="absolute -top-32 left-1/3 w-[36rem] h-[36rem] bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Loading State -->
    <template x-if="weatherLoading && !weatherData">
        <div class="w-full min-h-[600px] flex flex-col items-center justify-center text-center space-y-5">
            <div class="w-14 h-14 border-4 border-amber-400/25 border-t-amber-400 rounded-full animate-spin"></div>
            <p class="text-2xl font-black text-white tracking-wide">Fetching Real-time Satellite Weather...</p>
            <p class="text-sm text-slate-400">Connecting to satellite weather service for <span class="text-amber-400 font-bold" x-text="weatherCity || 'your location'"></span></p>
        </div>
    </template>

    <!-- Error State -->
    <template x-if="weatherError && !weatherData">
        <div class="w-full min-h-[600px] flex flex-col items-center justify-center text-center space-y-4">
            <span class="text-5xl">⚠️</span>
            <h3 class="text-2xl font-black text-rose-400">Weather Unavailable</h3>
            <p class="text-sm text-slate-300 max-w-md" x-text="weatherError"></p>
            <button @click="refreshWeather()" class="px-6 py-2 rounded-xl bg-amber-400 text-black font-black text-sm cursor-pointer hover:bg-amber-300 transition-all">↻ Retry</button>
        </div>
    </template>

    <!-- Main Content when weatherData exists -->
    <template x-if="weatherData">
        <div class="flex flex-col gap-4 relative z-10">

            <!-- ══════════════════════════════════════════
                 1. TOP HEADER & CONTROLLER BAR
                 ══════════════════════════════════════════ -->
            <div class="flex items-center justify-between pb-4 border-b border-amber-500/30">
                <!-- Airport / City Title & Code -->
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-amber-400 text-black flex items-center justify-center p-2 font-black text-xl shadow-[0_0_20px_rgba(251,191,36,0.5)] flex-shrink-0">
                        <img :src="getWeatherIcon(weatherData.current.weatherCode)" alt="weather" class="w-full h-full object-contain">
                    </div>
                    <div>
                        <div class="flex items-center gap-3">
                            <span class="text-2xl font-black text-white tracking-wide uppercase" x-text="weatherData.city || 'MUMBAI'"></span>
                            <span class="font-mono font-black text-xs px-2.5 py-0.5 rounded-md bg-amber-400/20 text-amber-300 border border-amber-400/40">LIVE</span>
                            <template x-if="weatherIsCached">
                                <span class="font-mono font-black text-xs px-2.5 py-0.5 rounded-md bg-red-400/20 text-red-300 border border-red-400/40">OFFLINE</span>
                            </template>
                        </div>
                        <p class="text-xs text-slate-400 flex items-center gap-2 mt-0.5">
                            <span class="text-amber-300 font-bold" x-text="getWeatherDesc(weatherData.current.weatherCode)"></span>
                            <span>•</span>
                            <span>Live satellite telemetry &amp; 7-day extended forecast</span>
                        </p>
                    </div>
                </div>

                <!-- Right Controls: Last Synced + Back Hint + Refresh Button -->
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399] animate-pulse"></span>
                        <span class="text-slate-400 font-bold uppercase tracking-wider text-[11px]">SYNCED:</span>
                        <span class="text-amber-300 font-black" x-text="weatherLastUpdated || 'Just Now'"></span>
                    </div>

                    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs text-slate-400 font-semibold">
                        <span>Press</span>
                        <span class="px-1.5 py-0.5 rounded bg-black/80 border border-white/20 text-white font-mono text-[10px]">BACK</span>
                        <span>to return</span>
                    </div>

                    <button id="tv-weather-refresh-btn"
                            @click="refreshWeather()"
                            tabindex="0"
                            class="px-4 py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-black font-black text-xs uppercase tracking-wider transition-all flex items-center gap-2 cursor-pointer shadow-[0_0_20px_rgba(251,191,36,0.35)] outline-none"
                            :class="(isRefreshing || weatherLoading) ? 'opacity-50 pointer-events-none' : ''">
                        <svg class="w-4 h-4 flex-shrink-0" :class="{ 'animate-spin': (isRefreshing || weatherLoading) }" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <span x-text="(isRefreshing || weatherLoading) ? 'SYNCING...' : 'REFRESH'"></span>
                    </button>
                </div>
            </div>

            <!-- ══════════════════════════════════════════
                 2. MIDDLE ROW: SPOTLIGHT + 4 METRIC CARDS
                 ══════════════════════════════════════════ -->
            <div class="grid grid-cols-12 gap-4">

                <!-- LEFT SPOTLIGHT CARD (5 cols ~42%) -->
                <div class="col-span-5 rounded-2xl border border-amber-500/40 bg-black/60 p-5 flex flex-col justify-between relative overflow-hidden shadow-lg">
                    <div class="absolute inset-0 bg-gradient-to-br from-amber-500/10 via-transparent to-transparent pointer-events-none"></div>

                    <!-- Header inside card -->
                    <div class="flex items-center justify-between relative z-10">
                        <span class="text-[11px] font-black uppercase tracking-widest text-slate-400">Current Conditions</span>
                        <span class="text-xs font-bold px-3 py-1 rounded-full bg-amber-400/20 text-amber-300 border border-amber-400/40 uppercase tracking-wider"
                              x-text="getWeatherDesc(weatherData.current.weatherCode)"></span>
                    </div>

                    <!-- Center: 3D Weather Icon + Temperature -->
                    <div class="flex items-center justify-center gap-5 my-4 relative z-10">
                        <img :src="getWeatherIcon(weatherData.current.weatherCode)"
                             alt="weather"
                             class="w-28 h-28 object-contain filter drop-shadow-[0_10px_25px_rgba(251,191,36,0.35)]">
                        <div>
                            <div class="text-6xl font-black text-white tracking-tight leading-none"
                                 x-text="weatherData.current.temp !== null ? (weatherData.current.temp > 0 ? '+' : '') + weatherData.current.temp + '°C' : '--°C'">
                            </div>
                            <div class="text-sm font-semibold text-slate-300 mt-2" x-show="weatherData.current.feelsLike !== null">
                                Feels <span class="font-black text-amber-300 text-base" x-text="weatherData.current.feelsLike + '°C'"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom: Clear Sky Pill + Air Quality -->
                    <div class="flex items-center justify-between gap-3 pt-3 border-t border-white/10 relative z-10">
                        <div class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-xs font-black uppercase tracking-wider text-white"
                             x-text="getWeatherDesc(weatherData.current.weatherCode)"></div>
                        <template x-if="weatherData.current.aqi !== null">
                            <div class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-black uppercase tracking-wider border"
                                 :class="getAqiInfo(weatherData.current.aqi).bgClass + ' ' + getAqiInfo(weatherData.current.aqi).textClass">
                                <span>AIR QUALITY</span>
                                <div class="w-8 h-2 rounded-full bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-500"></div>
                                <span x-text="'AQI ' + weatherData.current.aqi + ' • ' + getAqiInfo(weatherData.current.aqi).label"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- RIGHT 2x2 METRICS GRID (7 cols ~58%) -->
                <div class="col-span-7 grid grid-cols-2 gap-4">

                    <!-- Metric 1: FEELS LIKE -->
                    <div class="rounded-2xl border border-amber-500/30 bg-black/60 p-4 flex items-center justify-between">
                        <div class="flex flex-col justify-between h-full">
                            <span class="text-[11px] font-black uppercase tracking-widest text-slate-400">FEELS LIKE</span>
                            <div>
                                <div class="text-4xl font-black text-amber-300 my-0.5"
                                     x-text="weatherData.current.feelsLike !== null ? weatherData.current.feelsLike + '°C' : '--'"></div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">REALFEEL INDEX</span>
                            </div>
                        </div>
                        <!-- Thermometer SVG -->
                        <div class="w-12 h-16 flex items-center justify-center">
                            <svg viewBox="0 0 32 80" class="w-8 h-16" fill="none">
                                <rect x="11" y="4" width="10" height="52" rx="5" fill="rgba(255,255,255,0.06)" stroke="rgba(251,191,36,0.4)" stroke-width="2"/>
                                <rect x="14" y="20" width="4" height="36" rx="2" fill="#fbbf24"/>
                                <circle cx="16" cy="64" r="10" fill="#fbbf24" stroke="rgba(251,191,36,0.6)" stroke-width="2"/>
                                <line x1="22" y1="14" x2="26" y2="14" stroke="rgba(251,191,36,0.5)" stroke-width="2"/>
                                <line x1="22" y1="26" x2="26" y2="26" stroke="rgba(251,191,36,0.5)" stroke-width="2"/>
                                <line x1="22" y1="38" x2="26" y2="38" stroke="rgba(251,191,36,0.5)" stroke-width="2"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Metric 2: HUMIDITY -->
                    <div class="rounded-2xl border border-amber-500/30 bg-black/60 p-4 flex items-center justify-between">
                        <div class="flex flex-col justify-between h-full">
                            <span class="text-[11px] font-black uppercase tracking-widest text-slate-400">HUMIDITY</span>
                            <div>
                                <div class="text-4xl font-black text-white my-0.5"
                                     x-text="weatherData.current.humidity !== null ? weatherData.current.humidity + '%' : '--'"></div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">MOISTURE LEVEL</span>
                            </div>
                        </div>
                        <!-- Circular Gauge SVG -->
                        <div class="w-16 h-16 relative flex items-center justify-center">
                            <svg viewBox="0 0 36 36" class="w-16 h-16 -rotate-90">
                                <path class="text-white/10" stroke-width="3.5" stroke="currentColor" fill="none"
                                      d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path class="text-sky-400" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none"
                                      :stroke-dasharray="(weatherData.current.humidity || 0) + ', 100'"
                                      d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <span class="absolute text-lg">💧</span>
                        </div>
                    </div>

                    <!-- Metric 3: WIND -->
                    <div class="rounded-2xl border border-amber-500/30 bg-black/60 p-4 flex items-center justify-between">
                        <div class="flex flex-col justify-between h-full">
                            <span class="text-[11px] font-black uppercase tracking-widest text-slate-400">WIND</span>
                            <div>
                                <div class="text-4xl font-black text-white my-0.5 flex items-baseline gap-1.5">
                                    <span x-text="weatherData.current.wind !== null ? weatherData.current.wind : '--'"></span>
                                    <span class="text-base font-black text-amber-400">KM/H</span>
                                </div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-500">VELOCITY FEED</span>
                            </div>
                        </div>
                        <!-- Compass SVG -->
                        <div class="w-16 h-16 flex items-center justify-center">
                            <svg viewBox="0 0 64 64" class="w-14 h-14" fill="none">
                                <circle cx="32" cy="32" r="28" stroke="rgba(251,191,36,0.4)" stroke-width="2" fill="rgba(0,0,0,0.5)"/>
                                <circle cx="32" cy="32" r="20" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
                                <text x="32" y="11" text-anchor="middle" fill="#fbbf24" font-size="7" font-weight="900" font-family="sans-serif">N</text>
                                <text x="32" y="59" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="6" font-family="sans-serif">S</text>
                                <text x="56" y="34" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="6" font-family="sans-serif">E</text>
                                <text x="8" y="34" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="6" font-family="sans-serif">W</text>
                                <polygon points="32,15 29,32 32,29 35,32" fill="#fbbf24"/>
                                <polygon points="32,49 35,32 32,35 29,32" fill="rgba(255,255,255,0.3)"/>
                                <circle cx="32" cy="32" r="2.5" fill="#fbbf24"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Metric 4: SUN CYCLE -->
                    <div class="rounded-2xl border border-amber-500/30 bg-black/60 p-4 flex flex-col justify-between">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-black uppercase tracking-widest text-slate-400">SUN CYCLE</span>
                            <span class="text-[10px] font-mono text-amber-300 font-bold">SOLAR HORIZON</span>
                        </div>
                        <!-- Arc Graphic -->
                        <div class="flex justify-center my-1">
                            <svg viewBox="0 0 120 48" class="w-full max-h-12">
                                <path d="M 10 44 A 50 40 0 0 1 110 44" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" stroke-linecap="round"/>
                                <path d="M 10 44 A 50 40 0 0 1 110 44" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
                                <circle cx="60" cy="8" r="5" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
                            </svg>
                        </div>
                        <!-- Times -->
                        <div class="flex items-center justify-between pt-1">
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Dawn</span>
                                <span class="text-xs font-mono font-black text-amber-300"
                                      x-text="formatTimeFromIso((weatherData.daily && weatherData.daily[0] ? weatherData.daily[0].sunrise : ''))">--:--</span>
                            </div>
                            <div class="flex flex-col text-right">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">Dusk</span>
                                <span class="text-xs font-mono font-black text-orange-400"
                                      x-text="formatTimeFromIso((weatherData.daily && weatherData.daily[0] ? weatherData.daily[0].sunset : ''))">--:--</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- ══════════════════════════════════════════
                 3. BOTTOM ROW: 7-DAY EXTENDED FORECAST STRIP
                 ══════════════════════════════════════════ -->
            <div>
                <div class="flex items-center justify-between mb-2.5 px-1">
                    <span class="text-xs font-black uppercase tracking-widest text-white flex items-center gap-2">
                        <span>📅</span>
                        <span>7-DAY EXTENDED FORECAST</span>
                    </span>
                    <span class="text-[10px] font-black uppercase tracking-wider text-amber-400">DAILY HIGH / LOW</span>
                </div>

                <div class="grid grid-cols-7 gap-3">
                    <template x-for="(day, idx) in weatherData.daily" :key="idx">
                        <div class="rounded-2xl p-3 flex flex-col items-center justify-between text-center transition-all duration-200 relative overflow-hidden"
                             :class="idx === 0
                                 ? 'bg-gradient-to-b from-amber-500/20 via-black to-black border-2 border-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.3)] scale-[1.02]'
                                 : 'bg-black/60 border border-white/10 hover:border-amber-400/50'">

                            <!-- Day Name -->
                            <span class="text-xs font-black uppercase tracking-wider"
                                  :class="idx === 0 ? 'text-amber-300' : 'text-slate-200'"
                                  x-text="formatWeatherDay(day.date, idx)">
                            </span>

                            <!-- Date -->
                            <span class="text-[10px] font-bold text-slate-400 mt-0.5"
                                  x-text="formatWeatherDate(day.date)">
                            </span>

                            <!-- Weather Icon -->
                            <img :src="getWeatherIcon(day.weatherCode)"
                                 :alt="getWeatherDesc(day.weatherCode)"
                                 class="w-12 h-12 object-contain my-2 filter drop-shadow-md">

                            <!-- Weather Description -->
                            <span class="text-[10px] font-bold text-slate-300 truncate w-full"
                                  x-text="getWeatherDesc(day.weatherCode)">
                            </span>

                            <!-- High / Low Temps -->
                            <div class="flex items-baseline font-mono font-bold gap-1 mt-1.5">
                                <span class="text-amber-300 font-black text-sm"
                                      x-text="day.maxTemp !== null ? day.maxTemp + '°' : '--'"></span>
                                <span class="text-slate-600 text-xs">/</span>
                                <span class="text-slate-400 font-semibold text-xs"
                                      x-text="day.minTemp !== null ? day.minTemp + '°' : '--'"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- ══════════════════════════════════════════
                 4. BOTTOM NAVIGATION HINT BAR
                 ══════════════════════════════════════════ -->
            <div class="flex items-center justify-between pt-2 border-t border-amber-500/20 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                <div class="flex items-center gap-4">
                    <span class="flex items-center gap-1.5">
                        <span class="px-2 py-0.5 rounded bg-white/10 text-white font-mono text-[9px]">OK</span>
                        <span>Refresh Weather</span>
                    </span>
                    <span class="flex items-center gap-1.5">
                        <span class="px-2 py-0.5 rounded bg-white/10 text-white font-mono text-[9px]">BACK</span>
                        <span>Exit to Menu</span>
                    </span>
                </div>
                <div>
                    <span>City: </span>
                    <span class="text-amber-400 font-black" x-text="weatherCity || 'Mumbai'"></span>
                </div>
            </div>

        </div>
    </template>

</div>
