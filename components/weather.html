<div class="flex-1 flex flex-col items-center justify-center px-10 py-3 select-none relative z-20 font-sans w-full max-w-6xl mx-auto">

    <!-- Loading State Overlay -->
    <template x-if="weatherLoading && !weatherData">
        <div class="w-full bg-[#121214]/90 backdrop-blur-2xl border-2 border-amber-500/35 rounded-3xl p-16 flex flex-col items-center justify-center shadow-2xl text-center space-y-4">
            <div class="w-14 h-14 border-4 border-amber-400/30 border-t-amber-400 rounded-full animate-spin"></div>
            <p class="text-xl font-bold text-white tracking-wide">
                Fetching Real-time Weather Forecast...
            </p>
            <p class="text-sm text-slate-400 font-medium">
                Loading data for <span class="text-amber-400 font-bold" x-text="weatherCity || 'Location'"></span>
            </p>
        </div>
    </template>

    <!-- Error State Overlay -->
    <template x-if="weatherError && !weatherData">
        <div class="w-full bg-[#121214]/90 backdrop-blur-2xl border-2 border-rose-500/40 rounded-3xl p-12 flex flex-col items-center justify-center shadow-2xl text-center space-y-4 max-w-xl">
            <span class="text-5xl">⚠️</span>
            <h3 class="text-2xl font-black text-rose-400 tracking-wide">
                Weather Unavailable
            </h3>
            <p class="text-sm text-slate-300" x-text="weatherError"></p>
            <button @click="loadWeatherData(true)" 
                    class="px-8 py-2.5 rounded-full bg-amber-500 text-black font-extrabold text-sm hover:bg-amber-400 transition shadow-lg cursor-pointer">
                ↻ Retry Now
            </button>
        </div>
    </template>

    <!-- Main Weather Dashboard Card -->
    <template x-if="weatherData">
        <div class="w-full bg-[#121214]/90 backdrop-blur-2xl border-2 border-amber-500/35 rounded-3xl p-6 sm:p-8 shadow-[0_20px_60px_rgba(0,0,0,0.9),0_0_40px_rgba(255,215,0,0.12)] flex flex-col justify-between relative overflow-hidden">

            <!-- Ambient Top Aura -->
            <div class="absolute -top-32 left-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Offline Cache Notice Badge (if applicable) -->
            <div x-show="weatherIsCached" 
                 class="mb-3 px-4 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-300 text-xs font-bold tracking-wide flex items-center justify-center gap-2 self-center">
                <span>⚠️</span>
                <span>Offline Mode — Showing Cached Weather Data for <strong x-text="weatherData.city"></strong></span>
            </div>

            <!-- TOP ROW: Current Weather Spotlight & Parameters Bento Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center relative z-10">

                <!-- Left Column: Spotlight (5 Cols) -->
                <div class="lg:col-span-5 flex flex-col items-start justify-center pl-2">
                    
                    <!-- City Name & Live Tag -->
                    <div class="flex items-center gap-3">
                        <h1 class="text-3xl sm:text-4xl font-black text-amber-400 tracking-wider drop-shadow-md uppercase"
                            x-text="weatherData.city">
                        </h1>
                        <span class="px-2.5 py-0.5 rounded-full bg-white/10 text-slate-300 text-[10px] font-extrabold uppercase tracking-widest border border-white/10">
                            LIVE
                        </span>
                    </div>

                    <!-- Weather Condition Text & Icon -->
                    <div class="flex items-center gap-2 mt-1">
                        <img :src="getWeatherIcon(weatherData.current.weatherCode)" 
                             alt="Weather" 
                             class="w-8 h-8 object-contain drop-shadow">
                        <span class="text-base sm:text-lg font-extrabold text-slate-200 tracking-wide"
                              x-text="getWeatherDesc(weatherData.current.weatherCode)">
                        </span>
                    </div>

                    <!-- Dynamic Temperature Display -->
                    <div class="flex items-baseline gap-3 my-1">
                        <span class="text-6xl sm:text-7xl font-black text-white tracking-tight drop-shadow-[0_4px_16px_rgba(0,0,0,0.8)]">
                            <span x-text="weatherData.current.temp !== null ? (weatherData.current.temp > 0 ? '+' : '') + weatherData.current.temp + '°C' : '--°C'"></span>
                        </span>
                        <template x-if="weatherData.current.feelsLike !== null">
                            <span class="text-slate-400 text-sm font-semibold">
                                Feels <strong class="text-amber-300 font-bold" x-text="weatherData.current.feelsLike + '°C'"></strong>
                            </span>
                        </template>
                    </div>

                    <!-- AQI Status Pill -->
                    <template x-if="weatherData.current.aqi !== null">
                        <div class="mt-1 flex items-center gap-2.5 px-3.5 py-1.5 rounded-xl border"
                             :class="getAqiInfo(weatherData.current.aqi).bgClass">
                            <span class="text-xs font-black tracking-wider" 
                                  :class="getAqiInfo(weatherData.current.aqi).textClass">
                                AQI <span x-text="weatherData.current.aqi"></span>
                            </span>
                            <span class="w-1 h-1 rounded-full bg-slate-400"></span>
                            <span class="text-xs font-extrabold tracking-wider" 
                                  :class="getAqiInfo(weatherData.current.aqi).textClass"
                                  x-text="getAqiInfo(weatherData.current.aqi).label">
                            </span>
                        </div>
                    </template>

                </div>

                <!-- Right Column: 6-Metric Premium Bento Grid (7 Cols) -->
                <div class="lg:col-span-7 grid grid-cols-3 gap-3">

                    <!-- 1. Feels Like -->
                    <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block" x-text="t('weather_feels', 'Feels Like')">Feels Like</span>
                        <span class="text-xl font-black text-amber-300 mt-0.5" x-text="weatherData.current.feelsLike !== null ? weatherData.current.feelsLike + '°C' : '--'"></span>
                    </div>

                    <!-- 2. Humidity -->
                    <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block" x-text="t('weather_humidity', 'Humidity')">Humidity</span>
                        <span class="text-xl font-black text-white mt-0.5" x-text="weatherData.current.humidity !== null ? weatherData.current.humidity + '%' : '--'"></span>
                    </div>

                    <!-- 3. Wind Speed -->
                    <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block" x-text="t('weather_wind', 'Wind')">Wind</span>
                        <span class="text-xl font-black text-white mt-0.5" x-text="weatherData.current.wind !== null ? weatherData.current.wind + ' KM/H' : '--'"></span>
                    </div>

                    <!-- 4. Pressure -->
                    <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block" x-text="t('weather_pressure', 'Pressure')">Pressure</span>
                        <span class="text-xl font-black text-white mt-0.5" x-text="weatherData.current.pressure !== null ? weatherData.current.pressure + ' MB' : '--'"></span>
                    </div>

                    <!-- 5. Sunrise -->
                    <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block" x-text="t('weather_sunrise', 'Sunrise')">Sunrise</span>
                        <span class="text-base sm:text-lg font-black text-amber-300 mt-0.5" x-text="formatTimeFromIso(weatherData.daily[0]?.sunrise)"></span>
                    </div>

                    <!-- 6. Sunset -->
                    <div class="p-3.5 rounded-2xl bg-white/[0.04] border border-white/10 flex flex-col justify-center">
                        <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block" x-text="t('weather_sunset', 'Sunset')">Sunset</span>
                        <span class="text-base sm:text-lg font-black text-amber-300 mt-0.5" x-text="formatTimeFromIso(weatherData.daily[0]?.sunset)"></span>
                    </div>

                </div>

            </div>

            <!-- DIVIDER -->
            <div class="w-full my-5 border-t border-amber-500/25"></div>

            <!-- BOTTOM ROW: 7-DAY EXTENDED FORECAST -->
            <div class="relative z-10">
                <div class="flex items-center justify-between mb-3 px-1">
                    <h3 class="text-xs sm:text-sm font-extrabold uppercase tracking-widest text-slate-300 flex items-center gap-2">
                        <span>🗓️</span>
                        <span>7-Day Extended Forecast</span>
                    </h3>
                    <span class="text-[11px] text-amber-400/80 font-bold">Daily High / Low</span>
                </div>

                <!-- 7 Forecast Cards Grid -->
                <div class="grid grid-cols-7 gap-2.5">
                    <template x-for="(day, idx) in weatherData.daily" :key="idx">
                        <div class="rounded-2xl p-3 flex flex-col items-center justify-between text-center transition-all duration-300 border relative"
                             :class="idx === 0 
                                ? 'bg-gradient-to-b from-amber-500/20 via-[#1a1710] to-black border-amber-400 shadow-[0_0_20px_rgba(255,215,0,0.3)]' 
                                : 'bg-white/[0.03] border-white/10 hover:border-amber-500/40 hover:bg-white/[0.06]'">
                            
                            <!-- Day Label -->
                            <span class="text-xs font-black tracking-wider uppercase"
                                  :class="idx === 0 ? 'text-amber-400' : 'text-slate-200'"
                                  x-text="formatWeatherDay(day.date, idx)">
                            </span>

                            <!-- Short Date -->
                            <span class="text-[10px] font-bold text-slate-400"
                                  x-text="formatWeatherDate(day.date)">
                            </span>

                            <!-- Weather Icon -->
                            <img :src="getWeatherIcon(day.weatherCode)" 
                                 :alt="getWeatherDesc(day.weatherCode)"
                                 class="w-10 h-10 object-contain my-2 drop-shadow transition-transform duration-300 group-hover:scale-110">

                            <!-- Short Desc -->
                            <span class="text-[10px] font-bold text-slate-300 truncate max-w-full"
                                  x-text="getWeatherDesc(day.weatherCode)">
                            </span>

                            <!-- Max / Min Temp -->
                            <div class="mt-1 flex items-baseline gap-1 text-xs">
                                <span class="font-black text-amber-300" x-text="day.maxTemp !== null ? day.maxTemp + '°' : '--'"></span>
                                <span class="text-slate-500 text-[10px]">/</span>
                                <span class="font-bold text-slate-400" x-text="day.minTemp !== null ? day.minTemp + '°' : '--'"></span>
                            </div>

                        </div>
                    </template>
                </div>

            </div>

            <!-- BOTTOM FOOTER -->
            <div class="mt-4 pt-3 border-t border-white/10 flex items-center justify-between text-xs text-slate-400 relative z-10">
                <p class="font-medium tracking-wide">
                    Press <span class="text-amber-400 font-bold">BACK</span> on TV remote to return to Interactive Services
                </p>
                <div class="flex items-center gap-2">
                    <button @click="loadWeatherData(true)" 
                            class="px-3 py-1 rounded-lg bg-black/60 border border-white/15 text-slate-300 hover:text-amber-300 text-[11px] font-bold flex items-center gap-1 cursor-pointer transition">
                        <span>↻</span>
                        <span>Refresh Weather</span>
                    </button>
                </div>
            </div>

        </div>
    </template>

</div>
