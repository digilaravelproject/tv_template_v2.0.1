<header class="w-full px-16 pt-10 pb-4 flex items-center justify-between z-30 select-none relative font-sans">

    <!-- LEFT: Time/Date (Home) OR Back Button (Sub-Pages) -->
    <div class="flex flex-col items-start min-w-[320px]">
        <template x-if="currentView === 'home'">
            <div class="flex flex-col items-start">
                <div class="text-3xl font-extrabold text-white tracking-wide drop-shadow-lg leading-none">
                    <span x-text="timeStr">--:-- --</span>
                </div>
                <div class="text-3xl font-extrabold text-white tracking-wide drop-shadow-lg mt-3 leading-none">
                    <span x-text="dateStr">-- --- ----</span>
                </div>
            </div>
        </template>

        <!-- Compact Pill Back Button on Sub-Pages -->
        <template x-if="currentView !== 'home'">
            <button id="tv-header-back-btn"
                    @click="goBack()"
                    @focus="if (['apps', 'applications'].includes(currentView)) { activeAppFocusIndex = 'header_back'; } else if (['language', 'languages'].includes(currentView)) { activeLangFocusIndex = 'header_back'; } else if (['input', 'inputs', 'hdmi'].includes(currentView)) { activeInputFocusIndex = 'header_back'; }"
                    @keydown.down="if (currentView === 'weather') { $event.preventDefault(); document.getElementById('tv-weather-refresh-btn')?.focus(); } else if (['input', 'inputs', 'hdmi'].includes(currentView)) { $event.preventDefault(); focusCurrentInputPort(); }"
                    tabindex="0"
                    class="group flex items-center justify-center space-x-2.5 px-7 py-2.5 rounded-full bg-black border-2 border-[#caa44d] text-white hover:bg-[#ffc700] hover:border-[#ffc700] hover:text-black hover:shadow-[0_0_30px_rgba(255,199,0,0.9),0_0_12px_rgba(255,215,0,0.95)] focus:bg-[#ffc700] focus:border-[#ffc700] focus:text-black focus:shadow-[0_0_35px_rgba(255,199,0,0.95),0_0_15px_rgba(255,215,0,0.95)] focus:scale-105 transition-all duration-300 outline-none cursor-pointer">
                <span class="text-2xl font-black transition-colors duration-200 group-hover:text-black group-focus:text-black leading-none">←</span>
                <span class="text-xl font-extrabold tracking-wider uppercase transition-colors duration-200 group-hover:text-black group-focus:text-black leading-none" x-text="t('back', t('previous', 'BACK')).toUpperCase()">BACK</span>
            </button>
        </template>
    </div>

    <!-- MIDDLE: Centered Hotel Logo (Always Visible on all pages) -->
    <div class="flex items-center justify-center flex-1 px-8">
        <template x-if="hotelLogo">
            <img :src="hotelLogo" alt="Hotel Logo" 
                 loading="lazy" decoding="async"
                 class="max-h-24 max-w-[360px] w-auto object-contain filter drop-shadow-2xl transition-all duration-500"
                 onerror="this.style.display='none'">
        </template>
    </div>

    <!-- RIGHT: Room Number & Weather (Visible on Home Page) -->
    <div class="flex flex-col items-end min-w-[320px] text-right">
        <template x-if="currentView === 'home'">
            <div class="flex flex-col items-end">
                <div class="text-3xl font-extrabold text-white tracking-wide drop-shadow-lg leading-none">
                    <span class="mr-2" x-text="t('room_label', 'Room')">Room</span><span class="text-amber-400 font-black" x-text="roomNo || '----'">----</span>
                </div>
                <template x-if="weatherStr">
                    <div class="text-3xl font-extrabold text-white tracking-wide drop-shadow-lg mt-3 leading-none">
                        <span x-text="weatherStr"></span>
                    </div>
                </template>
            </div>
        </template>
    </div>

</header>
