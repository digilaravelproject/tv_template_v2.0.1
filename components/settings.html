<!-- ============================================================
     HOTEL LUXURY TV TEMPLATE v2.0.1 - SETTINGS & ADMIN ACCESS
     PIN Authentication (YYMMDD Date Format) + Advanced Configuration
     ============================================================ -->
<div class="w-full flex-1 flex flex-col items-center justify-center select-none font-sans relative z-20">

    <!-- ============================================================
         STEP 1: ADMIN ACCESS PIN AUTHENTICATION SCREEN
         ============================================================ -->
    <template x-if="settingsStep === 'auth'">
        <div
            class="w-full max-w-[560px] rounded-3xl border-2 border-amber-500/60 bg-[#0e0f14] p-8 shadow-[0_25px_80px_rgba(0,0,0,1),inset_0_0_30px_rgba(179,138,45,0.2)] flex flex-col items-center text-center relative overflow-hidden">

            <!-- Ambient Golden Aura -->
            <div
                class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none">
            </div>

            <!-- Shield / Lock Vector Icon -->
            <div
                class="relative z-10 w-20 h-20 rounded-2xl bg-gradient-to-br from-amber-500/25 via-[#1e1a12] to-black border-2 border-amber-400/70 flex items-center justify-center text-amber-400 shadow-[0_0_30px_rgba(255,215,0,0.4)] mb-4">
                <svg class="w-10 h-10 animate-pulse" viewBox="0 0 24 24" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
                        clip-rule="evenodd" />
                </svg>
            </div>

            <!-- Title & Subtitle -->
            <div class="relative z-10">
                <h2
                    class="text-3xl font-black text-amber-400 tracking-[0.15em] uppercase drop-shadow-[0_2px_10px_rgba(255,215,0,0.6)]">
                    ADMIN ACCESS
                </h2>
                <p class="text-slate-300 text-xs font-semibold tracking-wide mt-1">
                    Enter 6-Digit Administrator PIN
                </p>
            </div>

            <!-- PIN Display Boxes (6 Digits) -->
            <div class="my-6 flex items-center justify-center gap-3 relative z-10">
                <template x-for="(char, idx) in maskedPin" :key="idx">
                    <div class="w-13 h-14 sm:w-14 sm:h-16 rounded-2xl border-2 flex items-center justify-center text-3xl font-black transition-all duration-300 select-none"
                        :class="[
                             authStatus === 'error' 
                                 ? 'border-rose-500 bg-rose-500/20 text-rose-300 shadow-[0_0_25px_rgba(244,63,94,0.6)] animate-bounce' 
                                 : (authStatus === 'success' 
                                     ? 'border-emerald-400 bg-emerald-500/25 text-emerald-300 shadow-[0_0_25px_rgba(52,211,153,0.7)]' 
                                     : (settingsPin.length === idx 
                                         ? 'border-amber-400 bg-amber-500/15 text-amber-300 shadow-[0_0_20px_rgba(255,215,0,0.5)] scale-105' 
                                         : (settingsPin.length > idx 
                                             ? 'border-amber-500/80 bg-amber-500/10 text-white' 
                                             : 'border-white/20 bg-white/5 text-slate-500')))
                         ]">
                        <span x-text="char"></span>
                    </div>
                </template>
            </div>

            <!-- Status / Error / Success Message -->
            <div class="h-6 mb-3 relative z-10 flex items-center justify-center">
                <span class="text-xs font-black uppercase tracking-wider transition-all duration-300"
                    :class="authStatus === 'error' ? 'text-rose-400 drop-shadow-[0_0_10px_rgba(244,63,94,0.8)]' : (authStatus === 'success' ? 'text-emerald-400 drop-shadow-[0_0_10px_rgba(52,211,153,0.8)]' : 'text-slate-400')"
                    x-text="authMessage || 'Press digits on remote or keypad below'">
                </span>
            </div>

            <!-- 3x4 TV Keypad Grid (1-9, DEL, 0, ESC) -->
            <div class="grid grid-cols-3 gap-3 w-full max-w-[380px] relative z-10 my-1">

                <!-- Digit 1 -->
                <button id="settings_key_0" tabindex="0" @click="addPinDigit(1)"
                    @mouseenter="activeKeypadIndex = 0; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 0; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(0)">
                    1
                </button>

                <!-- Digit 2 -->
                <button id="settings_key_1" tabindex="0" @click="addPinDigit(2)"
                    @mouseenter="activeKeypadIndex = 1; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 1; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(1)">
                    2
                </button>

                <!-- Digit 3 -->
                <button id="settings_key_2" tabindex="0" @click="addPinDigit(3)"
                    @mouseenter="activeKeypadIndex = 2; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 2; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(2)">
                    3
                </button>

                <!-- Digit 4 -->
                <button id="settings_key_3" tabindex="0" @click="addPinDigit(4)"
                    @mouseenter="activeKeypadIndex = 3; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 3; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(3)">
                    4
                </button>

                <!-- Digit 5 -->
                <button id="settings_key_4" tabindex="0" @click="addPinDigit(5)"
                    @mouseenter="activeKeypadIndex = 4; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 4; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(4)">
                    5
                </button>

                <!-- Digit 6 -->
                <button id="settings_key_5" tabindex="0" @click="addPinDigit(6)"
                    @mouseenter="activeKeypadIndex = 5; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 5; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(5)">
                    6
                </button>

                <!-- Digit 7 -->
                <button id="settings_key_6" tabindex="0" @click="addPinDigit(7)"
                    @mouseenter="activeKeypadIndex = 6; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 6; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(6)">
                    7
                </button>

                <!-- Digit 8 -->
                <button id="settings_key_7" tabindex="0" @click="addPinDigit(8)"
                    @mouseenter="activeKeypadIndex = 7; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 7; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(7)">
                    8
                </button>

                <!-- Digit 9 -->
                <button id="settings_key_8" tabindex="0" @click="addPinDigit(9)"
                    @mouseenter="activeKeypadIndex = 8; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 8; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(8)">
                    9
                </button>

                <!-- Key DEL -->
                <button id="settings_key_9" tabindex="0" @click="delPinDigit()"
                    @mouseenter="activeKeypadIndex = 9; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 9; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(9, 'del')">
                    ⌫
                </button>

                <!-- Digit 0 -->
                <button id="settings_key_10" tabindex="0" @click="addPinDigit(0)"
                    @mouseenter="activeKeypadIndex = 10; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 10; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-2xl transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(10)">
                    0
                </button>

                <!-- Key ESC / Back -->
                <button id="settings_key_11" tabindex="0" @click="handleSettingsEsc()"
                    @mouseenter="activeKeypadIndex = 11; document.getElementById('tv-header-back-btn')?.blur();"
                    @focus="activeKeypadIndex = 11; document.getElementById('tv-header-back-btn')?.blur();"
                    class="h-14 rounded-2xl font-black text-base transition-all duration-200 outline-none flex items-center justify-center cursor-pointer border select-none"
                    :class="getKeypadBtnClass(11, 'esc')">
                    ESC
                </button>

            </div>

            <!-- Remote Help Footer -->
            <div
                class="mt-5 pt-3 border-t border-white/10 w-full flex items-center justify-center text-[11px] text-slate-400 font-bold">
                <span>Direct Remote digits <strong class="text-white font-mono">0-9</strong> supported</span>
            </div>

        </div>
    </template>

    <!-- ============================================================
         STEP 2: ADVANCED CONFIGURATION DASHBOARD (Unlocked)
         ============================================================ -->
    <template x-if="settingsStep === 'dashboard'">
        <div
            class="w-full max-w-[1540px] min-h-[760px] max-h-[890px] rounded-3xl border-2 border-amber-500/60 bg-[#0b0c10] p-8 lg:p-9 shadow-[0_30px_90px_rgba(0,0,0,1),inset_0_0_35px_rgba(179,138,45,0.15)] flex flex-col justify-between relative overflow-hidden select-none font-sans">

            <!-- Ambient Glow -->
            <div
                class="absolute -top-32 left-1/3 w-[36rem] h-[36rem] bg-amber-500/5 rounded-full blur-3xl pointer-events-none">
            </div>

            <!-- Dashboard Top Header Bar -->
            <div
                class="flex items-center justify-between pb-5 border-b border-amber-500/30 flex-shrink-0 relative z-10">
                <div class="flex items-center gap-5">
                    <div
                        class="w-15 h-15 rounded-2xl bg-gradient-to-br from-amber-500/30 via-amber-600/20 to-black border-2 border-amber-500/70 flex items-center justify-center text-3xl text-amber-400 shadow-[0_0_25px_rgba(179,138,45,0.4)] flex-shrink-0">
                        ⚙️
                    </div>
                    <div class="text-left">
                        <h1
                            class="text-3xl lg:text-4xl font-black uppercase tracking-[0.12em] text-amber-400 drop-shadow-[0_2px_10px_rgba(0,0,0,0.9)] leading-tight">
                            ADVANCED CONFIGURATION
                        </h1>
                        <p class="text-sm font-semibold text-slate-300 tracking-wide mt-1">
                            System management, hardware telemetry & default port routing
                        </p>
                    </div>
                </div>

                <!-- Admin Status Beacon Badge -->
                <div class="flex items-center gap-3">
                    <div
                        class="px-4 py-2 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-xs font-black uppercase tracking-wider flex items-center gap-2 shadow-sm">
                        <span
                            class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.9)] animate-pulse"></span>
                        <span>ADMIN VERIFIED</span>
                    </div>
                </div>
            </div>

            <!-- Main Dashboard Body (2 Column Layout) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 my-5 relative z-10 items-stretch flex-1">

                <!-- LEFT COLUMN (8 Cols): Room, Default TV Input & Diagnostics Table -->
                <div class="lg:col-span-8 flex flex-col gap-5 justify-between">

                    <!-- Top Row: Room Number & Default TV Input Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                        <!-- Room Number Box (100% Server Managed / Read-Only) -->
                        <div
                            class="p-5 rounded-2xl bg-[#12131a] border-2 border-white/10 flex flex-col justify-between shadow-lg relative overflow-hidden">
                            <div class="flex items-center justify-between mb-2">
                                <span
                                    class="text-xs font-black uppercase tracking-widest text-slate-400 flex items-center gap-1.5">
                                    <span>🏨</span>
                                    <span>ROOM NUMBER</span>
                                </span>
                                <span
                                    class="text-[11px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700 font-bold uppercase flex items-center gap-1">
                                    <span>🔒</span>
                                    <span>READ ONLY</span>
                                </span>
                            </div>
                            <div class="my-2 flex items-baseline gap-3">
                                <span class="text-4xl font-black text-amber-300 font-mono tracking-wider"
                                    x-text="roomNo || hotelData?.device?.room_no || '1111'"></span>
                                <span class="text-xs text-slate-400 font-medium">Server Assigned</span>
                            </div>
                            <p class="text-xs text-slate-400 border-t border-white/5 pt-2 mt-1">
                                Synchronized via Central Hotel Management System
                            </p>
                        </div>

                        <!-- Default TV Input Box (Interactive & Editable) -->
                        <div
                            class="p-5 rounded-2xl bg-[#12131a] border-2 border-amber-500/30 flex flex-col justify-between shadow-lg">
                            <div class="flex items-center justify-between mb-2">
                                <span
                                    class="text-xs font-black uppercase tracking-widest text-amber-400 flex items-center gap-1.5">
                                    <span>📺</span>
                                    <span>DEFAULT TV INPUT</span>
                                </span>
                                <span
                                    class="text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-bold uppercase flex items-center gap-1">
                                    <span>✔</span>
                                    <span x-text="liveTvSelectedPort"></span>
                                </span>
                            </div>

                            <!-- Interactive Port Selector Pills -->
                            <div class="flex flex-wrap gap-2.5 my-2">
                                <template x-for="(port, pIdx) in availableTvPorts" :key="port">
                                    <button :id="`settings_port_${pIdx}`"
                                            type="button"
                                            tabindex="0"
                                            @click="selectDefaultTvInput(port); dashboardFocus = `port_${pIdx}`"
                                            @mouseenter="dashboardFocus = `port_${pIdx}`"
                                            @focus="dashboardFocus = `port_${pIdx}`"
                                            class="px-3.5 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-200 cursor-pointer outline-none border flex items-center gap-1.5"
                                            :class="[
                                                liveTvSelectedPort === port 
                                                    ? 'bg-amber-400 text-black border-amber-300 shadow-[0_0_15px_rgba(255,215,0,0.85)]' 
                                                    : 'bg-white/10 text-slate-200 border-white/20 hover:border-amber-400/60 hover:bg-white/15',
                                                dashboardFocus === `port_${pIdx}` 
                                                    ? 'ring-4 ring-amber-400 scale-110 !border-amber-300 shadow-[0_0_25px_rgba(255,215,0,0.95)] z-20 brightness-110' 
                                                    : 'scale-100'
                                            ]">
                                        <span x-text="port"></span>
                                        <span x-show="liveTvSelectedPort === port" class="text-xs">✔</span>
                                    </button>
                                </template>
                            </div>

                            <p class="text-xs text-slate-400 border-t border-white/5 pt-2 mt-1">
                                Select startup port connected to STB / Live TV
                            </p>
                        </div>

                    </div>

                    <!-- Hardware & Network Diagnostics Table Card -->
                    <div class="p-6 rounded-2xl bg-[#0f1015] border-2 border-amber-500/20 flex flex-col flex-1 shadow-inner justify-between">
                        <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
                            <h3
                                class="text-sm font-black uppercase tracking-widest text-amber-400 flex items-center gap-2">
                                <span>⚡</span>
                                <span>Hardware & Network Diagnostics</span>
                            </h3>
                            <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
                                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                <span>Live TV Bridge Telemetry</span>
                            </div>
                        </div>

                        <!-- 10 Diagnostic Fields in Spacious High-Contrast Grid -->
                        <div class="grid grid-cols-2 gap-x-8 gap-y-3.5 text-sm font-medium">
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">Android ID:</span>
                                <span class="font-mono text-white font-extrabold truncate max-w-[210px]"
                                    x-text="hwData.serial"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">IP Address:</span>
                                <span class="font-mono text-amber-300 font-black text-base" x-text="hwData.ip"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">MAC Address:</span>
                                <span class="font-mono text-white font-extrabold" x-text="hwData.mac"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">Gateway:</span>
                                <span class="font-mono text-white font-extrabold" x-text="hwData.gateway"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">Subnet Mask:</span>
                                <span class="font-mono text-white font-extrabold" x-text="hwData.subnet"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">DNS Server:</span>
                                <span class="font-mono text-white font-extrabold" x-text="hwData.dns"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">Device Model:</span>
                                <span class="text-white font-extrabold" x-text="hwData.model"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5 border-b border-white/5">
                                <span class="text-slate-400 font-bold">Device Brand:</span>
                                <span class="text-white font-extrabold capitalize" x-text="hwData.brand"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5">
                                <span class="text-slate-400 font-bold">Android OS:</span>
                                <span class="text-emerald-400 font-black text-base" x-text="hwData.android"></span>
                            </div>
                            <div class="flex items-center justify-between py-1.5">
                                <span class="text-slate-400 font-bold">Template Version:</span>
                                <span class="font-mono text-amber-400 font-black text-base"
                                    x-text="hwData.version"></span>
                            </div>
                        </div>

                    </div>

                </div>

                <!-- RIGHT COLUMN (4 Cols): System Management & Diagnostic Controls -->
                <div class="lg:col-span-4 flex flex-col justify-between gap-5">

                    <!-- Android System & Bridge Management Card -->
                    <div
                        class="p-6 rounded-2xl bg-[#12131a] border-2 border-white/10 flex flex-col justify-between flex-1 shadow-lg">
                        <div>
                            <div class="flex items-center gap-3 pb-3 border-b border-white/10 mb-4">
                                <span class="text-2xl">🛠️</span>
                                <div>
                                    <h3 class="text-sm font-black uppercase tracking-widest text-amber-400">
                                        System Management
                                    </h3>
                                    <p class="text-xs text-slate-400 font-medium mt-0.5">
                                        Native OS settings and hardware bridge controls
                                    </p>
                                </div>
                            </div>

                            <p class="text-xs text-slate-300 leading-relaxed mb-4">
                                Launch native Android TV system settings for Wi-Fi, Bluetooth, Audio, and Display
                                configurations, or refresh telemetry directly from firmware.
                            </p>
                        </div>

                        <div class="flex flex-col gap-4">
                            <!-- Open Native Android Settings Button -->
                            <button id="settings-android-btn"
                                    tabindex="0"
                                    @click="triggerAndroidSettings(); dashboardFocus = 'android_settings'"
                                    @mouseenter="dashboardFocus = 'android_settings'"
                                    @focus="dashboardFocus = 'android_settings'"
                                    class="w-full py-4 px-6 rounded-2xl border-2 transition-all duration-300 font-black text-sm tracking-wider uppercase flex items-center justify-center gap-3 cursor-pointer outline-none shadow-lg group"
                                    :class="dashboardFocus === 'android_settings' 
                                        ? 'ring-4 ring-amber-400 bg-amber-400 text-black border-amber-300 scale-[1.02] shadow-[0_0_35px_rgba(255,215,0,0.9)] font-black' 
                                        : 'bg-gradient-to-r from-[#1f1f28] to-[#16161e] border-amber-500/50 text-white hover:border-amber-400 hover:bg-amber-400/20'">
                                <span class="text-2xl group-hover:scale-110 group-focus:scale-110 transition-transform">⚙️</span>
                                <span>Open Android Settings</span>
                            </button>

                            <!-- Refresh Diagnostics Button -->
                            <button id="settings-refresh-btn"
                                    tabindex="0"
                                    @click="loadHardwareDetails(true); dashboardFocus = 'refresh_hw'"
                                    @mouseenter="dashboardFocus = 'refresh_hw'"
                                    @focus="dashboardFocus = 'refresh_hw'"
                                    class="w-full py-3.5 px-6 rounded-2xl border transition-all font-black text-xs tracking-wider uppercase flex items-center justify-center gap-2.5 cursor-pointer outline-none"
                                    :class="dashboardFocus === 'refresh_hw' 
                                        ? 'ring-4 ring-amber-400 bg-amber-400/30 text-amber-300 border-amber-400 scale-[1.02] shadow-[0_0_25px_rgba(255,215,0,0.7)] font-black' 
                                        : 'bg-white/5 border-white/15 text-slate-300 hover:border-white/30 hover:bg-white/10'">
                                <span class="text-base" :class="isRefreshingHw ? 'animate-spin' : ''">↻</span>
                                <span x-text="isRefreshingHw ? 'Refreshing Telemetry...' : 'Refresh Hardware Diagnostics'">Refresh Hardware Diagnostics</span>
                            </button>
                        </div>
                    </div>

                    <!-- System Status Card -->
                    <div
                        class="p-5 rounded-2xl bg-[#12131a] border-2 border-white/10 flex items-center justify-between shadow-md">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">📡</span>
                            <div>
                                <h4 class="text-xs font-black uppercase text-slate-300 tracking-wider">Network Bridge
                                    Status</h4>
                                <p class="text-[11px] text-slate-400 mt-0.5">Connected to TV Controller</p>
                            </div>
                        </div>
                        <span
                            class="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-500/40 text-emerald-400 text-xs font-black">ONLINE</span>
                    </div>

                </div>

            </div>

            <!-- Bottom Action Controls Bar -->
            <div class="pt-5 border-t border-white/15 flex items-center justify-between relative z-10 flex-shrink-0">
                <p class="text-xs lg:text-sm font-semibold text-slate-400">
                    Press <span class="text-amber-400 font-bold">BACK</span> or <span
                        class="text-amber-400 font-bold">EXIT</span> to return to Interactive Services
                </p>

                <div class="flex items-center gap-4">
                    <!-- Save Configuration Button -->
                    <button id="settings-save-btn"
                            tabindex="0"
                            @click="saveConfiguration(); dashboardFocus = 'save'"
                            @mouseenter="dashboardFocus = 'save'"
                            @focus="dashboardFocus = 'save'"
                            class="px-10 py-3.5 rounded-full bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 text-black font-black text-sm uppercase tracking-wider transition-all cursor-pointer outline-none"
                            :class="dashboardFocus === 'save' 
                                ? 'ring-4 ring-white scale-105 shadow-[0_0_35px_rgba(255,215,0,1)] brightness-125' 
                                : 'shadow-[0_0_20px_rgba(255,215,0,0.6)] hover:brightness-110'">
                        <span x-text="isSavingConfig ? 'Saving...' : 'Save Configuration'">Save Configuration</span>
                    </button>

                    <!-- Exit Button -->
                    <button id="settings-exit-btn"
                            tabindex="0"
                            @click="goBack(); dashboardFocus = 'exit'"
                            @mouseenter="dashboardFocus = 'exit'"
                            @focus="dashboardFocus = 'exit'"
                            class="px-8 py-3.5 rounded-full border text-white font-extrabold text-sm uppercase tracking-wider transition-all cursor-pointer outline-none"
                            :class="dashboardFocus === 'exit' 
                                ? 'ring-4 ring-amber-400 bg-white/30 border-white/60 scale-105 shadow-[0_0_25px_rgba(255,255,255,0.7)]' 
                                : 'bg-white/10 hover:bg-white/20 border-white/20'">
                        Exit
                    </button>
                </div>
            </div>

        </div>
    </template>

</div>
