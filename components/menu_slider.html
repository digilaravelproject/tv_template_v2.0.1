<div class="w-full pb-8 pt-8 flex flex-col items-center justify-end select-none relative z-30 font-sans overflow-visible"
     :class="isMenuFlipping ? 'scale-90 opacity-0 -translate-y-4' : 'scale-100 opacity-100 translate-y-0'"
     style="transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1); will-change: transform, opacity;">


    <!-- ============================================================
         UNIFIED DYNAMIC ADAPTIVE CAROUSEL
         Automatically scales and centers for ANY number of items (1 to 20+)
         ============================================================ -->
    <div class="w-full px-6 pt-10 pb-2 relative overflow-visible"
        :style="currentMenuList.length >= 6 ? '-webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.85) 3%, black 6%, black 94%, rgba(0,0,0,0.85) 97%, transparent 100%); mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.85) 3%, black 6%, black 94%, rgba(0,0,0,0.85) 97%, transparent 100%);' : ''">

        <div class="w-full flex items-end py-3 overflow-visible max-w-[1900px] mx-auto" :class="{
                'justify-between': currentMenuList.length >= 6,
                'space-x-12 justify-center': currentMenuList.length >= 3 && currentMenuList.length < 6,
                'space-x-16 justify-center': currentMenuList.length < 3
             }">

            <template x-for="slot in getVisibleSlots()" :key="slot.uniqueKey">
                <div @click="onSlotClick(slot)"
                    class="flex flex-col items-center justify-center cursor-pointer flex-shrink-0"
                    :class="slot.scaleClass"
                    style="width: 250px; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease; will-change: transform, opacity;">

                    <!-- Icon Container with Center Spotlight Golden Glow -->
                    <div class="relative flex items-center justify-center overflow-visible transition-all duration-300">
                        <img :src="getMenuIcon(slot.item)" :alt="slot.item.name"
                            loading="lazy" decoding="async"
                            class="object-contain rounded-full transition-all duration-300" :class="slot.imgClass"
                            style="transition: all 0.4s cubic-bezier(0.34, 1.4, 0.64, 1); will-change: transform, box-shadow, border-color;"
                            @error="$el.style.opacity='0.3'">
                    </div>

                    <!-- Label Display -->
                    <div class="mt-3 text-center"
                        style="transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform, color;">
                        <span class="tracking-wider block whitespace-nowrap uppercase" :class="slot.textClass"
                            x-text="getMenuTitle(slot.item)">
                        </span>
                    </div>

                </div>
            </template>

        </div>
    </div>

    <!-- Device ID footer (subtle) -->
    <div class="w-full px-12 flex justify-end pt-1">
        <span class="text-[11px] font-mono text-slate-500/80 tracking-wider"
            x-text="`ID: ${hotelData.device?.device_id || '3d761ddf4a5d30a3'}`"></span>
    </div>

</div>
