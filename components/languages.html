<!-- ============================================================
     HOTEL LUXURY TV TEMPLATE v2.0.1 - LANGUAGES COMPONENT
     Full 21-Language Grid with Universal D-Pad Remote Navigation
     ============================================================ -->
<div x-show="['language', 'languages'].includes(currentView)"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     class="w-full flex-1 flex flex-col items-center justify-start px-12 pt-10 pb-3 select-none relative z-20 font-sans">

    <!-- Centered Luxury Modal Container (1540px Large TV Width) -->
    <div class="w-full max-w-[1540px] rounded-3xl border-2 border-amber-500/60 bg-gradient-to-br from-[#121212]/95 via-[#0a0a0a]/95 to-black/95 p-6 shadow-[0_20px_60px_rgba(0,0,0,0.95),inset_0_0_25px_rgba(179,138,45,0.15)] backdrop-blur-2xl flex flex-col justify-between overflow-hidden">

        <!-- Top Header Bar -->
        <div class="flex items-center gap-4 pb-3 border-b border-amber-500/30 flex-shrink-0">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-500/25 to-amber-600/15 border-2 border-amber-500/70 flex items-center justify-center text-2xl text-amber-400 shadow-[0_0_15px_rgba(179,138,45,0.35)] p-2">
                🌐
            </div>
            <div>
                <h1 class="text-2xl font-black uppercase tracking-[0.18em] text-amber-400 drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]"
                    x-text="t('icons.language', 'SELECT LANGUAGE').toUpperCase()">
                    SELECT LANGUAGE
                </h1>
                <p class="text-sm font-semibold text-slate-300 tracking-wide">
                    Choose your preferred system language
                </p>
            </div>
        </div>

        <!-- 3-Column Languages Grid (Fits all 21 items directly on 1 screen without scrolling) -->
        <div id="languages-grid-container" 
             class="grid grid-cols-3 gap-x-6 gap-y-2.5 my-2.5 p-2 overflow-visible">

            <template x-for="(lang, idx) in availableLanguages" :key="lang.file">
                <div @click="selectLanguage(lang.file, idx)"
                     @mouseenter="activeLangFocusIndex = idx"
                     tabindex="0"
                     :id="`lang_item_${idx}`"
                     @focus="activeLangFocusIndex = idx"
                     class="h-[62px] px-5 rounded-2xl flex items-center justify-between cursor-pointer transition-all duration-200 outline-none border text-left group"
                     :class="{
                         'bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 border-white text-black shadow-[0_0_25px_rgba(255,215,0,0.95),0_6px_15px_rgba(0,0,0,0.9)] scale-[1.02] z-30 font-black ring-2 ring-amber-300': activeLangFocusIndex === idx,
                         'bg-amber-500/15 border-amber-500/70 text-white shadow-sm': selectedLangFile === lang.file && activeLangFocusIndex !== idx,
                         'bg-white/[0.04] border-white/10 text-white hover:border-amber-500/50 hover:bg-white/[0.08]': selectedLangFile !== lang.file && activeLangFocusIndex !== idx
                     }">

                    <!-- Left: Radio Circle + Native Language Name -->
                    <div class="flex items-center gap-3.5 overflow-hidden">
                        <!-- Custom Radio Circle -->
                        <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-colors duration-200"
                             :class="{
                                 'border-black': activeLangFocusIndex === idx,
                                 'border-amber-400': selectedLangFile === lang.file && activeLangFocusIndex !== idx,
                                 'border-white/30': selectedLangFile !== lang.file && activeLangFocusIndex !== idx
                             }">
                            <div class="w-2.5 h-2.5 rounded-full transition-transform duration-200"
                                 :class="{
                                     'bg-black scale-100': activeLangFocusIndex === idx && selectedLangFile === lang.file,
                                     'bg-black/50 scale-75': activeLangFocusIndex === idx && selectedLangFile !== lang.file,
                                     'bg-amber-400 scale-100': selectedLangFile === lang.file && activeLangFocusIndex !== idx,
                                     'scale-0': selectedLangFile !== lang.file && activeLangFocusIndex !== idx
                                 }"></div>
                        </div>

                        <!-- Language Name in Native Script (Large & Clear) -->
                        <span class="text-[21px] tracking-wide truncate"
                              :class="activeLangFocusIndex === idx ? 'text-black font-black' : 'text-slate-100 font-bold'"
                              x-text="lang.name"></span>
                    </div>

                    <!-- Right: Language ISO Badge -->
                    <span class="px-2.5 py-0.5 rounded-md text-xs font-black tracking-wider uppercase flex-shrink-0 transition-colors duration-200"
                          :class="{
                              'bg-black/25 text-black font-black': activeLangFocusIndex === idx,
                              'bg-amber-500/20 text-amber-300 border border-amber-500/40': selectedLangFile === lang.file && activeLangFocusIndex !== idx,
                              'bg-black/50 text-slate-400 border border-white/5': selectedLangFile !== lang.file && activeLangFocusIndex !== idx
                          }"
                          x-text="lang.code"></span>
                </div>
            </template>

        </div>

        <!-- Bottom Action Buttons Bar -->
        <div class="flex items-center justify-end gap-4 pt-3 border-t border-amber-500/30 flex-shrink-0">
            <!-- Apply & Continue Button -->
            <button id="lang-btn-apply"
                    @click="applyLanguage()"
                    @mouseenter="activeLangFocusIndex = 'apply'"
                    @focus="activeLangFocusIndex = 'apply'"
                    tabindex="0"
                    class="flex items-center gap-2.5 px-8 py-2.5 rounded-2xl font-black text-base tracking-wide uppercase transition-all duration-200 outline-none cursor-pointer border-2"
                    :class="activeLangFocusIndex === 'apply' 
                        ? 'bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 border-white text-black shadow-[0_0_30px_rgba(255,215,0,0.95)] scale-105 ring-2 ring-amber-300' 
                        : 'bg-amber-500/20 border-amber-500/50 text-amber-300 hover:bg-amber-500/30'">
                <span class="text-lg leading-none">✓</span>
                <span x-text="t('apply_continue', 'Apply & Continue')">Apply &amp; Continue</span>
            </button>

            <!-- Cancel / Back Button -->
            <button id="lang-btn-cancel"
                    @click="goBack()"
                    @mouseenter="activeLangFocusIndex = 'cancel'"
                    @focus="activeLangFocusIndex = 'cancel'"
                    tabindex="0"
                    class="flex items-center gap-2.5 px-8 py-2.5 rounded-2xl font-black text-base tracking-wide uppercase transition-all duration-200 outline-none cursor-pointer border-2"
                    :class="activeLangFocusIndex === 'cancel' 
                        ? 'bg-white text-black border-white shadow-[0_0_25px_rgba(255,255,255,0.85)] scale-105' 
                        : 'bg-white/[0.06] border-white/20 text-white hover:bg-white/[0.12]'">
                <span class="text-lg leading-none">✕</span>
                <span x-text="t('back', t('previous', 'Back'))">Back</span>
            </button>
        </div>

    </div>

    <!-- Bottom Subtle Remote Hint Bar -->
    <div class="mt-3 flex items-center gap-6 px-7 py-1.5 rounded-full bg-black/70 border border-amber-500/30 backdrop-blur-md shadow-lg flex-shrink-0">
        <span class="text-xs font-bold text-slate-200 uppercase tracking-widest flex items-center gap-1.5">
            <span class="text-amber-400 font-extrabold text-sm">▲ ▼ ◄ ►</span> Navigate
        </span>
        <span class="text-amber-500/50 font-bold">•</span>
        <span class="text-xs font-bold text-slate-200 uppercase tracking-widest flex items-center gap-1.5">
            <span class="text-amber-400 font-extrabold text-sm">OK</span> Select
        </span>
        <span class="text-amber-500/50 font-bold">•</span>
        <span class="text-xs font-bold text-slate-200 uppercase tracking-widest flex items-center gap-1.5">
            <span class="text-amber-400 font-extrabold text-sm">▼</span> Jump to Apply
        </span>
        <span class="text-amber-500/50 font-bold">•</span>
        <span class="text-xs font-bold text-slate-200 uppercase tracking-widest flex items-center gap-1.5">
            <span class="text-amber-400 font-extrabold text-sm">BACK</span> Exit
        </span>
    </div>

</div>
