<!-- ============================================================
     HOTEL LUXURY TV TEMPLATE v2.0.1 - APPLICATIONS COMPONENT
     Smart TV OTT Applications Grid with Flutter Native Bridge
     ============================================================ -->
<div x-show="['apps', 'applications'].includes(currentView)"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 scale-95"
     x-transition:enter-end="opacity-100 scale-100"
     class="w-full flex-1 flex flex-col items-center justify-start px-12 pt-8 pb-4 select-none relative z-20 font-sans">

    <!-- Centered Luxury Modal Container (1560px Wide TV Canvas) -->
    <div class="w-full max-w-[1560px] max-h-[820px] rounded-3xl border-2 border-amber-500/60 bg-gradient-to-br from-[#121212]/95 via-[#0c0c0c]/95 to-black/95 p-7 shadow-[0_25px_70px_rgba(0,0,0,0.95),inset_0_0_25px_rgba(179,138,45,0.15)] backdrop-blur-2xl flex flex-col justify-between overflow-hidden">

        <!-- Top Header Bar -->
        <div class="flex items-center justify-between pb-4 border-b border-amber-500/30 flex-shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-13 h-13 rounded-2xl bg-gradient-to-br from-amber-500/30 to-amber-600/15 border-2 border-amber-500/70 flex items-center justify-center text-3xl text-amber-400 shadow-[0_0_20px_rgba(179,138,45,0.4)] p-2">
                    📱
                </div>
                <div>
                    <h1 class="text-3xl font-black uppercase tracking-[0.16em] text-amber-400 drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]"
                        x-text="t('icons.applications', t('icons.apps', 'APPLICATIONS')).toUpperCase()">
                        APPLICATIONS
                    </h1>
                    <p class="text-sm font-semibold text-slate-300 tracking-wide mt-0.5"
                       x-text="t('apps_subtitle', 'Launch streaming apps & entertainment channels on your TV')">
                        Launch streaming apps & entertainment channels on your TV
                    </p>
                </div>
            </div>

            <!-- Apps Counter & Remote Instructions Badge -->
            <div class="flex items-center gap-3">
                <div class="px-4 py-1.5 rounded-full bg-amber-500/15 border border-amber-500/50 text-amber-300 text-xs font-bold uppercase tracking-wider flex items-center gap-2 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span x-text="getActiveOttList().length + ' ' + t('apps_count', 'Apps Available')"></span>
                </div>
                <div class="hidden sm:flex items-center gap-1.5 text-xs text-slate-400 font-semibold px-3 py-1 bg-white/5 rounded-lg border border-white/10">
                    <span>Use</span>
                    <span class="px-1.5 py-0.5 rounded bg-black/80 border border-white/20 text-white font-mono text-[10px]">▲ ▼ ◄ ►</span>
                    <span>to navigate &</span>
                    <span class="px-2 py-0.5 rounded bg-amber-500/30 border border-amber-400 text-amber-300 font-bold text-[10px]">OK</span>
                    <span>to Launch</span>
                </div>
            </div>
        </div>

        <!-- 5-Column Applications Grid (Scrollbar Hidden with no-scrollbar, Extra Padding to Prevent Clipping) -->
        <div id="apps-grid-container" 
             class="grid grid-cols-5 gap-6 my-3 p-6 overflow-y-auto max-h-[580px] no-scrollbar">

            <template x-for="(app, idx) in getActiveOttList()" :key="app.id || idx">
                <div @click="launchApp(app)"
                     @mouseenter="activeAppFocusIndex = idx; lastAppCardIndex = idx; document.getElementById('tv-header-back-btn')?.blur();"
                     tabindex="0"
                     :id="`app_card_${idx}`"
                     @focus="activeAppFocusIndex = idx; lastAppCardIndex = idx; document.getElementById('tv-header-back-btn')?.blur();"
                     class="h-52 rounded-2xl flex flex-col items-center justify-between p-4 cursor-pointer transition-all duration-300 outline-none border text-center relative group select-none"
                     :class="{
                         'bg-gradient-to-b from-amber-500/25 via-[#181818] to-black border-2 border-amber-400 shadow-[0_0_35px_rgba(255,215,0,0.7),0_12px_28px_rgba(0,0,0,0.95)] scale-[1.05] z-30 ring-2 ring-amber-300': activeAppFocusIndex === idx,
                         'bg-white/[0.04] border border-white/10 hover:border-amber-500/50 hover:bg-white/[0.08] hover:scale-[1.02]': activeAppFocusIndex !== idx
                     }">

                    <!-- Glow overlay inside card when active -->
                    <div x-show="activeAppFocusIndex === idx" 
                         class="absolute inset-0 bg-gradient-to-t from-amber-500/20 via-transparent to-transparent pointer-events-none rounded-2xl"></div>

                    <!-- Centered Uniform Square Icon Box with Slight Border Radius -->
                    <div class="w-full flex-1 flex items-center justify-center pt-1 pb-2 relative z-10">
                        <div class="w-24 h-24 rounded-2xl flex items-center justify-center p-3 overflow-hidden transition-all duration-300 relative shadow-md"
                             :class="getAppBoxClass(app, activeAppFocusIndex === idx)">

                            <!-- App Icon Image (if available) -->
                            <template x-if="getAppIcon(app)">
                                <img :src="getAppIcon(app)"
                                     :alt="app.name"
                                     loading="lazy"
                                     decoding="async"
                                     class="w-full h-full object-contain drop-shadow-[0_4px_8px_rgba(0,0,0,0.8)] transition-transform duration-300"
                                     :class="activeAppFocusIndex === idx ? 'scale-110' : 'scale-100'">
                            </template>

                            <!-- Clean Brand Acronym if image is not available (Zero fallback image principle) -->
                            <template x-if="!getAppIcon(app)">
                                <span class="font-black text-2xl tracking-wider transition-transform duration-300"
                                      :class="activeAppFocusIndex === idx ? 'scale-110 drop-shadow-[0_0_10px_rgba(255,255,255,0.8)]' : 'scale-100'"
                                      x-text="getAppInitials(app.name)">
                                </span>
                            </template>

                        </div>
                    </div>

                    <!-- App Name & Status Indicator -->
                    <div class="w-full pt-2 border-t border-white/10 relative z-10 flex flex-col items-center flex-shrink-0">
                        <h3 class="text-sm sm:text-base font-extrabold tracking-wide truncate max-w-full transition-colors duration-200"
                            :class="activeAppFocusIndex === idx ? 'text-amber-300 drop-shadow-[0_2px_8px_rgba(255,215,0,0.6)]' : 'text-slate-200'"
                            x-text="app.name">
                        </h3>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full" 
                                  :class="activeAppFocusIndex === idx ? 'bg-amber-400 animate-pulse' : 'bg-emerald-400'"></span>
                            <span class="text-[10px] font-bold uppercase tracking-wider"
                                  :class="activeAppFocusIndex === idx ? 'text-amber-200' : 'text-slate-400'"
                                  x-text="t('app_ready', 'Open App')">
                            </span>
                        </div>
                    </div>

                </div>
            </template>

        </div>

        <!-- Bottom Action Bar (Clear & Concise) -->
        <div class="flex items-center justify-between pt-3 border-t border-amber-500/25 flex-shrink-0">
            <p class="text-xs text-slate-400 font-medium tracking-wide">
                Press <span class="text-amber-400 font-bold">BACK</span> on TV remote to return to Home screen
            </p>
            <div class="flex items-center gap-2 text-xs text-slate-400 font-semibold">
                <span>Select app with</span>
                <span class="px-2 py-0.5 rounded bg-amber-500/30 border border-amber-400 text-amber-300 font-bold text-[10px]">OK</span>
            </div>
        </div>

    </div>

    <!-- Floating Luxury Toast Notification for Launch Feedback -->
    <div x-show="toastMessage"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-6 scale-90"
         x-transition:enter-end="opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="opacity-0 translate-y-6 scale-90"
         class="fixed bottom-12 z-50 px-8 py-4 rounded-2xl bg-black/95 border-2 border-amber-400 shadow-[0_15px_50px_rgba(0,0,0,0.95),0_0_30px_rgba(255,215,0,0.6)] backdrop-blur-2xl flex items-center gap-4 text-white font-bold text-lg">
        <span class="text-2xl animate-spin">⚡</span>
        <span x-text="toastMessage"></span>
    </div>

</div>
